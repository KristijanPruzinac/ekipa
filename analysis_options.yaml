# Shared analyzer configuration for every package in the workspace.
#
# very_good_analysis over flutter_lints: it treats warnings as errors by default and
# enables the rules that catch the v1 defects recorded in docs/v3/LEGACY_AUDIT.md —
# implicit dynamic, missing await, and public API without documentation.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Quarantined v1/v2 source (directive D1). Never analysed, never imported.
    # Deleted at P2 exit. The import ban itself is enforced by tools/lint, not here.
    - legacy/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
  errors:
    # A behavioural TODO must not be silently tolerable; it fails the build once dated.
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ekipa_core is a pure package; print() there would be an IO leak the dependency
    # lint cannot see, because it inspects imports rather than calls.
    avoid_print: true
    prefer_const_constructors: true
    public_member_api_docs: false

    # Disabled deliberately, with the reason, because a silently disabled lint is
    # indistinguishable from one nobody understood.
    #
    # one_member_abstracts wants `typedef Clock = DateTime Function()` instead of
    # a one-method interface. Wrong for this codebase: ports are the vocabulary
    # of the architecture (01_ARCHITECTURE.md §4), and `Clock` names a concept
    # that a bare function type does not. A `DateTime Function()` parameter is
    # also indistinguishable from any other zero-argument date supplier at a call
    # site, which is exactly the confusion the port exists to remove.
    one_member_abstracts: false
