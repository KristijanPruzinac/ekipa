org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Gradle's virtual file system watcher holds Windows directory handles open and
# races cleanMergeDebugAssets on this checkout, which lives under a OneDrive-synced
# folder. Disabling the watcher costs a little incremental build speed and removes
# an intermittent, environment-specific build failure that looks like a code bug.
# Harmless on CI, which is Linux and builds clean each time.
org.gradle.vfs.watch=false
