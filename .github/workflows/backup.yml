name: Encrypted database backup
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
concurrency:
  group: wagz-encrypted-backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create authenticated encrypted snapshot
        env:
          DATABASE_URL: ${{ secrets.WAGZ_DATABASE_URL }}
          WAGZ_BACKUP_KEY: ${{ secrets.WAGZ_BACKUP_KEY }}
        run: node --import tsx scripts/backup.ts --output "$RUNNER_TEMP/wagz-backup.wagz"
      - name: Store only the encrypted backup for 30 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wagz-encrypted-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wagz-backup.wagz
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
