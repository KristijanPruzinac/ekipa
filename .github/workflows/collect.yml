name: Collect Osijek events
on:
  schedule:
    # GitHub cron is UTC. The gate selects the slot for Europe/Zagreb's season.
    - cron: '0 16 * * 2,5'
    - cron: '0 17 * * 2,5'
  workflow_dispatch:
concurrency:
  group: wagz-collection
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.WAGZ_DATABASE_URL }}
      WAGZ_DATABASE_MIGRATIONS: disabled
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: google/gemini-2.5-flash-lite
      WAGZ_AI_MONTHLY_BUDGET_USD: '1'
      WAGZ_AUTO_PUBLISH: 'true'
      WAGZ_GEOCODE: 'on'
      # Instagram pilot: with no APIFY_TOKEN secret the sources stay off and cost nothing.
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      WAGZ_APIFY_MAX_COST_USD: '0.10'
      WAGZ_INSTAGRAM_POSTS: '5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Select Tuesday and Friday at 18:00 Europe/Zagreb
        id: schedule
        env:
          WAGZ_TRIGGER_EVENT: ${{ github.event_name }}
          WAGZ_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/collection-schedule.ts
      - run: npm ci
        if: steps.schedule.outputs.collect == 'true'
      - name: Check durable database is configured
        if: steps.schedule.outputs.collect == 'true'
        run: node -e "if (!process.env.DATABASE_URL) { console.error('Missing WAGZ_DATABASE_URL repository secret.'); process.exit(1); }"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.schedule.outputs.collect == 'true'
        with:
          path: data/source-cache
          key: wagz-sources-${{ github.run_id }}
          restore-keys: wagz-sources-
      - run: npm run collect
        if: steps.schedule.outputs.collect == 'true'
