name: Collect Osijek events
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
concurrency:
  group: wagz-collection
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.WAGZ_DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: google/gemini-2.5-flash-lite
      WAGZ_AI_MONTHLY_BUDGET_USD: '1'
      WAGZ_AUTO_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check durable database is configured
        run: node -e "if (!process.env.DATABASE_URL) { console.error('Missing WAGZ_DATABASE_URL repository secret.'); process.exit(1); }"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/source-cache
          key: wagz-sources-${{ github.run_id }}
          restore-keys: wagz-sources-
      - run: npm run collect
