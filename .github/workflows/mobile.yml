name: WagZ mobile

on:
  push:
    paths:
      - apps/mobile/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/mobile.yml
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS WagZ origin (no /api path, credentials, or secrets)
        required: true
        type: string
        default: https://wagz.com.hr
      build_variant:
        description: Signed release is installable; unsigned release is verification only
        required: true
        default: signed-release
        type: choice
        options:
          - signed-release
          - unsigned-release
          - debug

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate public API origin
        if: github.event_name == 'workflow_dispatch'
        env:
          WAGZ_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import urlsplit

          value = os.environ['WAGZ_API_BASE_URL']
          url = urlsplit(value)
          host = url.hostname or ''
          valid = (
              value == value.strip()
              and not re.search(r'[\s\\]', value)
              and url.scheme == 'https'
              and url.username is None and url.password is None
              and url.path in ('', '/')
              and '?' not in value and '#' not in value
              and not host.endswith(('.localhost', '.local', '.invalid', '.test', '.example'))
          )
          try:
              valid = valid and ipaddress.ip_address(host).is_global
          except ValueError:
              valid = valid and bool(re.fullmatch(
                  r'(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}', host
              ))
          try:
              valid = valid and (url.port is None or url.port == 443)
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit('api_base_url must be a public HTTPS origin without credentials, a path, query, or fragment.')
          print('Public HTTPS API origin accepted.')
          PY

      - name: Set up Java
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.7'

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze mobile code
        run: flutter analyze --no-pub

      - name: Run mobile tests
        run: flutter test --no-pub --concurrency=2

      - name: Prepare explicit Android signing mode
        id: signing
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_VARIANT: ${{ inputs.build_variant }}
          WAGZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.WAGZ_ANDROID_KEYSTORE_BASE64 }}
          WAGZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WAGZ_ANDROID_KEYSTORE_PASSWORD }}
          WAGZ_ANDROID_KEY_ALIAS: ${{ secrets.WAGZ_ANDROID_KEY_ALIAS }}
          WAGZ_ANDROID_KEY_PASSWORD: ${{ secrets.WAGZ_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('WAGZ_ANDROID_KEYSTORE_BASE64', 'WAGZ_ANDROID_KEYSTORE_PASSWORD', 'WAGZ_ANDROID_KEY_ALIAS', 'WAGZ_ANDROID_KEY_PASSWORD')
          values = [os.environ.get(name, '').strip() for name in names]
          if any(values) and not all(values):
              raise SystemExit('Android signing secrets are incomplete. Configure all four secrets before building.')
          mode = os.environ['BUILD_VARIANT']
          if mode not in ('signed-release', 'unsigned-release', 'debug'):
              raise SystemExit('Select a supported build_variant.')
          if mode == 'signed-release':
              if not all(values):
                  raise SystemExit('Signed release requires all four Android signing secrets. Choose unsigned-release or debug explicitly for development.')
              if any('\n' in value or '\r' in value for value in values):
                  raise SystemExit('Signing values must not contain embedded newlines.')
              key = Path(os.environ['RUNNER_TEMP']) / 'wagz-upload.jks'
              try:
                  key.write_bytes(base64.b64decode(values[0], validate=True))
              except ValueError:
                  raise SystemExit('Android keystore secret is not valid base64.')
              key.chmod(0o600)
              def escape(value):
                  return value.replace('\\', '\\\\').replace(':', '\\:').replace('=', '\\=')
              props = Path('android/key.properties')
              props.write_text('\n'.join(f'{name}={escape(value)}' for name, value in (
                  ('storeFile', str(key)), ('storePassword', values[1]),
                  ('keyAlias', values[2]), ('keyPassword', values[3]),
              )) + '\n', encoding='utf-8')
              props.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'WAGZ_ALLOW_UNSIGNED_RELEASE={str(mode == "unsigned-release").lower()}\n')
          PY

      - name: Build Android APK and release app bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          WAGZ_API_BASE_URL: ${{ inputs.api_base_url }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          if [ "$BUILD_VARIANT" = debug ]; then
            flutter build apk --debug --dart-define="WAGZ_API_BASE_URL=$WAGZ_API_BASE_URL"
          else
            # Keep tooling regeneration enabled: switching from tests/debug to
            # release removes dev-only plugins from the Android registrant.
            flutter build apk --release --dart-define="WAGZ_API_BASE_URL=$WAGZ_API_BASE_URL"
            flutter build appbundle --release --dart-define="WAGZ_API_BASE_URL=$WAGZ_API_BASE_URL"
          fi

      - name: Verify release APK signature
        if: github.event_name == 'workflow_dispatch' && inputs.build_variant == 'signed-release'
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Remove temporary signing material
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/wagz-upload.jks"

      - name: Upload Android build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wagz-android-${{ inputs.build_variant }}-${{ github.run_number }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
