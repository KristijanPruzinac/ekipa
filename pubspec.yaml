# Pub workspace root. Owns no code — it exists so that one `dart pub get` resolves
# every package against one shared lockfile, and one `dart test` in CI compiles
# ekipa_core against all four of its consumers at once.
#
# That is what makes D3 ("the same algorithm everywhere") a fact rather than a claim:
# a change to a matching rule cannot compile in the worker and fail in the app,
# because they are resolved together or not at all.
name: _ekipa_workspace
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - packages/ekipa_core
  - packages/ekipa_data
  - packages/ekipa_ui
  - apps/mobile
  - apps/console
  - services/mill
  - tools/simulator
  - tools/lint

dev_dependencies:
  very_good_analysis: ^9.0.0
