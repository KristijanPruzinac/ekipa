org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Gradle's native file-system watcher holds Windows directory handles open
# between builds, which races with cleanMergeDebugAssets trying to delete
# those same directories (surfaces as "Unable to delete directory" on this
# OneDrive-synced checkout). Disabling VFS watching trades a little
# incremental-build speed for builds that don't randomly fail on Windows.
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
