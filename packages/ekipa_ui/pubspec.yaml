name: ekipa_ui
description: >-
  The design system: tokens, primitives and motion. No feature code, no
  infrastructure, no business rules. Direction "Zar" (proof 04) — dark slate
  ground, ember accent, one serif reserved for people and places.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  # Value objects only, so that PersonName can refuse a raw String and rule 11
  # of 11_SECURITY.md §8 is enforced by the compiler rather than by review. The
  # dependency points inward; tools/lint forbids ekipa_ui reaching any further
  # (UI-NO-DATA, UI-NO-MATCHING).
  ekipa_core: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  # Bundled rather than fetched at runtime — see fonts/OFL.md for the reason and
  # the licences. All three families are OFL 1.1.
  fonts:
    - family: Archivo
      fonts:
        - asset: fonts/Archivo-Regular.ttf
          weight: 400
        - asset: fonts/Archivo-Medium.ttf
          weight: 500
        - asset: fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: fonts/Archivo-Bold.ttf
          weight: 700
    - family: Instrument Serif
      fonts:
        - asset: fonts/InstrumentSerif-Regular.ttf
          weight: 400
    - family: DM Mono
      fonts:
        - asset: fonts/DMMono-Regular.ttf
          weight: 400
        - asset: fonts/DMMono-Medium.ttf
          weight: 500
