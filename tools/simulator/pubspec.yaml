name: simulator
description: >-
  Synthetic-population harness over the real matchmaker. Runs twelve simulated
  weeks and prints the metric table, so every ratio in 03_MATCHMAKER.md is tuned
  against a population before it is tuned against people.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  ekipa_core: ^0.1.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^9.0.0
